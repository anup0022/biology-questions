<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <rect width="800" height="500" fill="#f8f9fa"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565C0">Human Reproductive System &amp; Gametogenesis</text>
  
  <!-- Sperm Structure (Left) -->
  <rect x="30" y="45" width="350" height="280" fill="#E3F2FD" rx="8" stroke="#1565C0" stroke-width="2"/>
  <text x="205" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Structure of Human Sperm</text>
  
  <!-- Sperm head -->
  <ellipse cx="140" cy="120" rx="20" ry="30" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
  
  <!-- Acrosome -->
  <path d="M125 93 Q140 80 155 93" fill="#E53935" stroke="#B71C1C" stroke-width="1.5"/>
  <line x1="125" y1="95" x2="70" y2="85" stroke="#333" stroke-width="1"/>
  <text x="35" y="82" font-size="10" fill="#E53935">A - Acrosome</text>
  <text x="35" y="94" font-size="8" fill="#666">(Enzymes: Hyaluronidase,</text>
  <text x="35" y="104" font-size="8" fill="#666">Acrosin)</text>
  
  <!-- Nucleus -->
  <ellipse cx="140" cy="125" rx="14" ry="20" fill="#0D47A1"/>
  <line x1="155" y1="120" x2="250" y2="100" stroke="#333" stroke-width="1"/>
  <text x="255" y="98" font-size="10" fill="#0D47A1">B - Nucleus (n=23)</text>
  <text x="255" y="110" font-size="8" fill="#666">(Haploid DNA)</text>
  
  <!-- Neck -->
  <rect x="136" y="150" width="8" height="15" fill="#FFA000"/>
  <line x1="144" y1="155" x2="250" y2="140" stroke="#333" stroke-width="1"/>
  <text x="255" y="138" font-size="10" fill="#FFA000">C - Neck</text>
  <text x="255" y="150" font-size="8" fill="#666">(Centriole pair)</text>
  
  <!-- Middle piece -->
  <rect x="135" y="165" width="10" height="50" fill="#4CAF50" rx="3"/>
  <!-- Mitochondria spiral -->
  <path d="M133 170 Q128 180 133 190 Q128 200 133 210" stroke="#2E7D32" stroke-width="1.5" fill="none"/>
  <path d="M147 170 Q152 180 147 190 Q152 200 147 210" stroke="#2E7D32" stroke-width="1.5" fill="none"/>
  <line x1="147" y1="190" x2="250" y2="180" stroke="#333" stroke-width="1"/>
  <text x="255" y="178" font-size="10" fill="#4CAF50">D - Middle Piece</text>
  <text x="255" y="190" font-size="8" fill="#666">(Mitochondria - energy)</text>
  
  <!-- Tail -->
  <path d="M140 215 Q142 250 138 280 Q140 300 142 310" stroke="#795548" stroke-width="2" fill="none"/>
  <line x1="142" y1="280" x2="250" y2="270" stroke="#333" stroke-width="1"/>
  <text x="255" y="268" font-size="10" fill="#795548">E - Tail/Flagellum</text>
  <text x="255" y="280" font-size="8" fill="#666">(9+2 axoneme, motility)</text>
  
  <!-- Menstrual Cycle (Right) -->
  <rect x="400" y="45" width="380" height="280" fill="#FCE4EC" rx="8" stroke="#C62828" stroke-width="2"/>
  <text x="590" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#C62828">Menstrual Cycle Phases (28 days)</text>
  
  <!-- Phase bars -->
  <!-- Menstrual -->
  <rect x="420" y="90" width="60" height="25" fill="#E53935" rx="3"/>
  <text x="450" y="107" text-anchor="middle" font-size="9" fill="#fff">Days 1-5</text>
  <text x="420" y="130" font-size="10" fill="#E53935">F - Menstrual Phase</text>
  <text x="420" y="142" font-size="8" fill="#666">(Endometrium sheds)</text>
  
  <!-- Follicular/Proliferative -->
  <rect x="490" y="90" width="100" height="25" fill="#FF9800" rx="3"/>
  <text x="540" y="107" text-anchor="middle" font-size="9" fill="#fff">Days 6-13</text>
  <text x="490" y="130" font-size="10" fill="#FF9800">G - Follicular Phase</text>
  <text x="490" y="142" font-size="8" fill="#666">(FSH ↑, Estrogen ↑,</text>
  <text x="490" y="152" font-size="8" fill="#666">Endometrium rebuilds)</text>
  
  <!-- Ovulation -->
  <rect x="595" y="85" width="35" height="35" fill="#4CAF50" rx="17"/>
  <text x="612" y="107" text-anchor="middle" font-size="9" fill="#fff">D14</text>
  <text x="640" y="100" font-size="10" fill="#4CAF50">H - Ovulation</text>
  <text x="640" y="112" font-size="8" fill="#666">(LH surge)</text>
  
  <!-- Luteal/Secretory -->
  <rect x="635" y="90" width="130" height="25" fill="#7B1FA2" rx="3"/>
  <text x="700" y="107" text-anchor="middle" font-size="9" fill="#fff">Days 15-28</text>
  <text x="635" y="130" font-size="10" fill="#7B1FA2">I - Luteal Phase</text>
  <text x="635" y="142" font-size="8" fill="#666">(Progesterone ↑ from</text>
  <text x="635" y="152" font-size="8" fill="#666">Corpus Luteum)</text>
  
  <!-- Hormone graph simplified -->
  <rect x="420" y="165" width="345" height="145" fill="#fff" rx="5" stroke="#ccc"/>
  <text x="593" y="183" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Hormone Levels</text>
  
  <!-- FSH line -->
  <path d="M430 270 Q470 260 500 240 Q520 250 540 270 Q600 275 700 280" stroke="#1565C0" stroke-width="1.5" fill="none"/>
  <text x="710" y="282" font-size="8" fill="#1565C0">FSH</text>
  
  <!-- LH line (spike at ovulation) -->
  <path d="M430 280 Q500 275 540 270 Q560 200 575 195 Q590 200 600 270 Q650 280 700 285" stroke="#E53935" stroke-width="1.5" fill="none"/>
  <text x="710" y="288" font-size="8" fill="#E53935">LH</text>
  
  <!-- Estrogen -->
  <path d="M430 290 Q480 285 520 250 Q540 240 560 245 Q600 270 650 285 Q680 288 700 290" stroke="#FF9800" stroke-width="1.5" fill="none"/>
  <text x="710" y="294" font-size="8" fill="#FF9800">Estrogen</text>
  
  <!-- Progesterone -->
  <path d="M430 295 Q500 295 560 290 Q600 260 640 240 Q680 250 720 290" stroke="#7B1FA2" stroke-width="1.5" fill="none"/>
  <text x="730" y="292" font-size="8" fill="#7B1FA2">Prog.</text>
  
  <!-- Day labels -->
  <text x="430" y="303" font-size="8" fill="#666">D1</text>
  <text x="540" y="303" font-size="8" fill="#666">D14</text>
  <text x="700" y="303" font-size="8" fill="#666">D28</text>
  
  <!-- Bottom section - Key concepts -->
  <rect x="30" y="340" width="740" height="150" fill="#F3E5F5" rx="8" stroke="#7B1FA2" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#7B1FA2">Key Concepts in Human Reproduction</text>
  
  <text x="50" y="390" font-size="11" fill="#333">J - Spermatogenesis: Spermatogonia(2n) → 1° Spermatocyte(2n) → 2° Spermatocyte(n) → Spermatid(n) → Sperm(n)</text>
  <text x="50" y="410" font-size="11" fill="#333">K - Oogenesis: Oogonia(2n) → 1° Oocyte(2n) [arrested Prophase-I at birth] → 2° Oocyte(n) + Polar body</text>
  <text x="50" y="430" font-size="11" fill="#333">L - Fertilization: Sperm capacitation → Acrosome reaction → Zona pellucida penetration → Cortical reaction (blocks polyspermy)</text>
  <text x="50" y="450" font-size="11" fill="#333">M - Implantation: Blastocyst implants Day 7 | Trophoblast → Placenta | Inner cell mass → Embryo</text>
  <text x="50" y="470" font-size="11" fill="#333">N - Hormones: hCG (maintains corpus luteum) | hPL (growth) | Relaxin (parturition) | Oxytocin (uterine contractions)</text>
</svg>
