<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <rect width="800" height="500" fill="#f8f9fa"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565C0">Z-Scheme of Light Reactions (Non-cyclic Photophosphorylation)</text>
  
  <!-- Y-axis label -->
  <text x="20" y="250" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90 20 250)">Redox Potential (Energy Level) →</text>
  
  <!-- Baseline -->
  <line x1="60" y1="420" x2="750" y2="420" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- PS II -->
  <rect x="100" y="360" width="80" height="50" fill="#1565C0" rx="5"/>
  <text x="140" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PS II</text>
  <text x="140" y="400" text-anchor="middle" font-size="9" fill="#E3F2FD">P680</text>
  
  <!-- PS II excited state -->
  <circle cx="140" cy="180" r="15" fill="#1565C0" opacity="0.7"/>
  <text x="140" y="185" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">P680*</text>
  
  <!-- Arrow from PSII to excited -->
  <path d="M140 360 L140 195" stroke="#FFA000" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="115" y="280" font-size="10" fill="#FFA000" transform="rotate(-90 115 280)">A - Light Energy</text>
  
  <!-- Water splitting -->
  <text x="80" y="440" font-size="10" fill="#1565C0">B - H₂O → 2H⁺ + ½O₂ + 2e⁻</text>
  <text x="80" y="455" font-size="9" fill="#666">(Photolysis - lumenal side)</text>
  <path d="M100 430 L140 410" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- Electron transport from PSII* -->
  <!-- Pheophytin -->
  <circle cx="200" cy="170" r="10" fill="#7B1FA2"/>
  <text x="200" y="155" text-anchor="middle" font-size="9" fill="#7B1FA2">Pheo</text>
  <line x1="155" y1="178" x2="190" y2="172" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- PQ -->
  <circle cx="260" cy="210" r="12" fill="#00695C"/>
  <text x="260" y="200" text-anchor="middle" font-size="9" fill="#00695C">C - PQ</text>
  <line x1="210" y1="175" x2="248" y2="203" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- Cyt b6f complex -->
  <rect x="290" y="240" width="60" height="35" fill="#E65100" rx="4"/>
  <text x="320" y="258" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">D - Cyt</text>
  <text x="320" y="270" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">b6f</text>
  <line x1="268" y1="218" x2="295" y2="242" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- PC -->
  <circle cx="390" cy="300" r="12" fill="#00838F"/>
  <text x="390" y="295" text-anchor="middle" font-size="9" fill="#fff">PC</text>
  <text x="390" y="320" text-anchor="middle" font-size="9" fill="#00838F">E - Plastocyanin</text>
  <line x1="350" y1="268" x2="380" y2="292" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- ATP synthesis label -->
  <rect x="280" y="290" width="70" height="20" fill="#FFF3E0" rx="3" stroke="#E65100"/>
  <text x="315" y="304" text-anchor="middle" font-size="9" font-weight="bold" fill="#E65100">ATP made</text>
  
  <!-- PS I -->
  <rect x="420" y="330" width="80" height="50" fill="#2E7D32" rx="5"/>
  <text x="460" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PS I</text>
  <text x="460" y="370" text-anchor="middle" font-size="9" fill="#C8E6C9">P700</text>
  
  <!-- Arrow from PC to PSI -->
  <line x1="402" y1="300" x2="425" y2="335" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- PS I excited -->
  <circle cx="460" cy="90" r="15" fill="#2E7D32" opacity="0.7"/>
  <text x="460" y="95" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">P700*</text>
  
  <!-- Arrow from PSI to excited -->
  <path d="M460 330 L460 105" stroke="#FFA000" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="435" y="220" font-size="10" fill="#FFA000" transform="rotate(-90 435 220)">F - Light Energy</text>
  
  <!-- Fd -->
  <circle cx="540" cy="80" r="12" fill="#4E342E"/>
  <text x="540" y="85" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">Fd</text>
  <text x="540" y="60" text-anchor="middle" font-size="9" fill="#4E342E">G - Ferredoxin</text>
  <line x1="475" y1="88" x2="528" y2="82" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- NADP reductase -->
  <rect x="590" y="90" width="70" height="30" fill="#AD1457" rx="4"/>
  <text x="625" y="105" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">NADP⁺</text>
  <text x="625" y="115" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">Reductase</text>
  <line x1="552" y1="82" x2="590" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- NADPH -->
  <rect x="680" y="85" width="80" height="35" fill="#FCE4EC" rx="4" stroke="#AD1457"/>
  <text x="720" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#AD1457">H - NADPH</text>
  <line x1="660" y1="105" x2="680" y2="103" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- Z-shape highlight -->
  <path d="M140 385 L140 180 L460 345 L460 90" stroke="none" fill="#FFA000" opacity="0.07" stroke-width="20"/>
  
  <!-- Legend -->
  <rect x="450" y="420" width="330" height="70" fill="#E8F5E9" rx="5" stroke="#2E7D32"/>
  <text x="615" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Products of Non-cyclic:</text>
  <text x="615" y="458" text-anchor="middle" font-size="10" fill="#333">ATP + NADPH + O₂</text>
  <text x="615" y="476" text-anchor="middle" font-size="10" fill="#333">Electron flow: H₂O → PSII → PQ → Cyt b6f → PC → PSI → Fd → NADP⁺</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
