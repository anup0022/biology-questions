<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <rect width="800" height="500" fill="#f8f9fa"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565C0">Recombinant DNA Technology - pBR322 Plasmid Vector</text>
  
  <!-- Circular plasmid -->
  <circle cx="400" cy="270" r="160" fill="none" stroke="#2E7D32" stroke-width="6"/>
  
  <!-- Origin of replication -->
  <circle cx="400" cy="110" r="12" fill="#E53935"/>
  <text x="400" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#E53935">A - ori</text>
  <text x="400" y="70" text-anchor="middle" font-size="10" fill="#666">(Origin of Replication)</text>
  
  <!-- ampR gene (left arc) -->
  <path d="M280 160 A160 160 0 0 0 270 320" stroke="#1565C0" stroke-width="12" fill="none" stroke-linecap="round"/>
  <text x="200" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">B - ampR</text>
  <text x="200" y="258" text-anchor="middle" font-size="10" fill="#666">(Ampicillin</text>
  <text x="200" y="273" text-anchor="middle" font-size="10" fill="#666">Resistance)</text>
  
  <!-- tetR gene (right arc) -->
  <path d="M520 160 A160 160 0 0 1 530 320" stroke="#FF6F00" stroke-width="12" fill="none" stroke-linecap="round"/>
  <text x="600" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#FF6F00">C - tetR</text>
  <text x="600" y="258" text-anchor="middle" font-size="10" fill="#666">(Tetracycline</text>
  <text x="600" y="273" text-anchor="middle" font-size="10" fill="#666">Resistance)</text>
  
  <!-- Restriction sites -->
  <!-- BamHI in tetR -->
  <rect x="505" y="180" width="8" height="20" fill="#D32F2F"/>
  <line x1="513" y1="190" x2="580" y2="165" stroke="#333" stroke-width="1"/>
  <text x="585" y="162" font-size="11" fill="#D32F2F">D - BamHI site</text>
  <text x="585" y="177" font-size="10" fill="#666">(in tetR gene)</text>
  
  <!-- EcoRI -->
  <rect x="445" y="415" width="8" height="20" fill="#7B1FA2"/>
  <line x1="449" y1="435" x2="500" y2="455" stroke="#333" stroke-width="1"/>
  <text x="505" y="455" font-size="11" fill="#7B1FA2">E - EcoRI site</text>
  
  <!-- PstI in ampR -->
  <rect x="287" y="280" width="8" height="20" fill="#00695C"/>
  <line x1="287" y1="290" x2="130" y2="310" stroke="#333" stroke-width="1"/>
  <text x="50" y="308" font-size="11" fill="#00695C">F - PstI site</text>
  <text x="50" y="323" font-size="10" fill="#666">(in ampR gene)</text>
  
  <!-- HindIII -->
  <rect x="310" y="155" width="8" height="20" fill="#E65100"/>
  <line x1="310" y1="165" x2="180" y2="140" stroke="#333" stroke-width="1"/>
  <text x="100" y="138" font-size="11" fill="#E65100">G - HindIII site</text>
  
  <!-- Size label -->
  <text x="400" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4361 bp</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" fill="#666">pBR322</text>
  
  <!-- rop gene -->
  <path d="M370 420 A160 160 0 0 0 340 390" stroke="#795548" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text x="300" y="430" text-anchor="middle" font-size="11" fill="#795548">H - rop gene</text>
  <text x="300" y="445" text-anchor="middle" font-size="10" fill="#666">(controls copy number)</text>
  
  <!-- Legend -->
  <rect x="20" y="465" width="760" height="30" fill="#E8F5E9" rx="5"/>
  <text x="400" y="485" text-anchor="middle" font-size="11" fill="#333">Selectable Markers: ampR &amp; tetR | Insertional inactivation: Foreign DNA inserted at restriction site inactivates the gene</text>
</svg>
