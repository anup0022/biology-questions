<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <rect width="800" height="500" fill="#f8f9fa"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565C0">Life Cycle of Plasmodium (Malarial Parasite)</text>
  
  <!-- Human body section -->
  <rect x="30" y="45" width="450" height="440" fill="#FFF3E0" rx="10" stroke="#E65100" stroke-width="2"/>
  <text x="255" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">IN HUMAN HOST</text>
  
  <!-- Mosquito section -->
  <rect x="500" y="45" width="280" height="440" fill="#E8F5E9" rx="10" stroke="#2E7D32" stroke-width="2"/>
  <text x="640" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">IN MOSQUITO</text>
  <text x="640" y="87" text-anchor="middle" font-size="10" fill="#666">(Female Anopheles)</text>
  
  <!-- Stage 1: Sporozoites injected -->
  <circle cx="120" cy="120" r="25" fill="#E53935" stroke="#B71C1C" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">Sporo-</text>
  <text x="120" y="130" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">zoites</text>
  <text x="120" y="155" text-anchor="middle" font-size="9" fill="#E53935">A - Infective stage</text>
  <text x="120" y="167" text-anchor="middle" font-size="8" fill="#666">(injected by mosquito bite)</text>
  
  <!-- Arrow to liver -->
  <path d="M145 120 L200 120" stroke="#333" stroke-width="1.5" marker-end="url(#arw2)"/>
  
  <!-- Stage 2: Liver (Pre-erythrocytic) -->
  <rect x="210" y="95" width="120" height="55" fill="#FF9800" rx="8"/>
  <text x="270" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">B - LIVER STAGE</text>
  <text x="270" y="130" text-anchor="middle" font-size="8" fill="#fff">(Pre-erythrocytic</text>
  <text x="270" y="142" text-anchor="middle" font-size="8" fill="#fff">Schizogony)</text>
  
  <!-- Arrow to RBC -->
  <path d="M270 150 L270 190" stroke="#333" stroke-width="1.5" marker-end="url(#arw2)"/>
  <text x="290" y="175" font-size="8" fill="#333">Merozoites</text>
  
  <!-- Stage 3: RBC cycle (Erythrocytic) -->
  <rect x="140" y="200" width="280" height="140" fill="#FFEBEE" rx="8" stroke="#E53935" stroke-width="1.5"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">C - ERYTHROCYTIC CYCLE (in RBCs)</text>
  
  <!-- Ring stage -->
  <circle cx="180" cy="270" r="18" fill="#fff" stroke="#E53935" stroke-width="2"/>
  <circle cx="185" cy="265" r="5" fill="#E53935"/>
  <text x="180" y="298" text-anchor="middle" font-size="8" fill="#333">Ring</text>
  <text x="180" y="308" text-anchor="middle" font-size="8" fill="#333">Trophozoite</text>
  
  <!-- Arrow -->
  <path d="M198 270 L232 270" stroke="#333" stroke-width="1" marker-end="url(#arw2)"/>
  
  <!-- Schizont -->
  <circle cx="260" cy="270" r="20" fill="#fff" stroke="#7B1FA2" stroke-width="2"/>
  <circle cx="253" cy="263" r="4" fill="#7B1FA2"/>
  <circle cx="267" cy="263" r="4" fill="#7B1FA2"/>
  <circle cx="253" cy="277" r="4" fill="#7B1FA2"/>
  <circle cx="267" cy="277" r="4" fill="#7B1FA2"/>
  <text x="260" y="298" text-anchor="middle" font-size="8" fill="#333">Schizont</text>
  <text x="260" y="308" text-anchor="middle" font-size="8" fill="#333">(D - Schizogony)</text>
  
  <!-- Arrow -->
  <path d="M280 270 L320 270" stroke="#333" stroke-width="1" marker-end="url(#arw2)"/>
  
  <!-- Merozoites burst -->
  <circle cx="350" cy="270" r="20" fill="#FFCDD2" stroke="#E53935" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="350" y="265" text-anchor="middle" font-size="7" fill="#C62828">Mero-</text>
  <text x="350" y="275" text-anchor="middle" font-size="7" fill="#C62828">zoites</text>
  <text x="350" y="298" text-anchor="middle" font-size="8" fill="#E53935">RBC bursts</text>
  <text x="350" y="310" text-anchor="middle" font-size="8" fill="#E53935">(E - Fever cycle)</text>
  
  <!-- Cycle arrow back -->
  <path d="M355 250 Q360 235 280 232 Q200 235 180 252" stroke="#333" stroke-width="1" fill="none" marker-end="url(#arw2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="8" fill="#333">Re-infect new RBCs</text>
  
  <!-- Stage 4: Gametocytes -->
  <rect x="100" y="360" width="200" height="50" fill="#CE93D8" rx="8"/>
  <text x="200" y="380" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">F - Gametocytes form</text>
  <text x="200" y="395" text-anchor="middle" font-size="9" fill="#fff">(Male &amp; Female) in blood</text>
  
  <!-- Arrow from RBC to gametocytes -->
  <path d="M280 340 L230 360" stroke="#333" stroke-width="1.5" marker-end="url(#arw2)"/>
  
  <!-- Arrow to mosquito -->
  <path d="M300 385 Q400 385 500 300" stroke="#333" stroke-width="2" marker-end="url(#arw2)" stroke-dasharray="5,3"/>
  <text x="400" y="370" font-size="9" fill="#333">Mosquito bites</text>
  <text x="400" y="383" font-size="9" fill="#333">infected human</text>
  
  <!-- In Mosquito stages -->
  <!-- Fertilization -->
  <circle cx="640" cy="140" r="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="640" y="137" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">G - Sexual</text>
  <text x="640" y="149" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">Cycle</text>
  <text x="640" y="175" text-anchor="middle" font-size="9" fill="#2E7D32">Gametes fuse → Zygote</text>
  
  <!-- Ookinete -->
  <path d="M640 195 L640 220" stroke="#333" stroke-width="1.5" marker-end="url(#arw2)"/>
  <ellipse cx="640" cy="240" rx="30" ry="15" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="640" y="244" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">Ookinete</text>
  
  <!-- Oocyst -->
  <path d="M640 255 L640 280" stroke="#333" stroke-width="1.5" marker-end="url(#arw2)"/>
  <circle cx="640" cy="305" r="25" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/>
  <text x="640" y="302" text-anchor="middle" font-size="8" font-weight="bold" fill="#1B5E20">H - Oocyst</text>
  <text x="640" y="314" text-anchor="middle" font-size="8" fill="#1B5E20">(on gut wall)</text>
  
  <!-- Sporozoites in salivary gland -->
  <path d="M640 330 L640 370" stroke="#333" stroke-width="1.5" marker-end="url(#arw2)"/>
  <rect x="590" y="375" width="100" height="45" fill="#E53935" rx="8"/>
  <text x="640" y="393" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">I - Sporozoites</text>
  <text x="640" y="406" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">in Salivary Gland</text>
  
  <!-- Arrow back to human -->
  <path d="M590 420 Q400 460 150 130" stroke="#E53935" stroke-width="2" fill="none" marker-end="url(#arw2)" stroke-dasharray="5,3"/>
  <text x="350" y="455" font-size="9" fill="#E53935">Mosquito bites new human</text>
  
  <!-- Legend -->
  <rect x="50" y="420" width="400" height="55" fill="#fff" rx="5" stroke="#333"/>
  <text x="70" y="440" font-size="10" font-weight="bold" fill="#333">Key Facts:</text>
  <text x="70" y="455" font-size="9" fill="#333">• P. vivax &amp; P. falciparum cause malaria | 48hr cycle (tertian) for P. vivax</text>
  <text x="70" y="468" font-size="9" fill="#333">• Sexual cycle in mosquito (definitive host) | Asexual in human (intermediate host)</text>
  
  <defs>
    <marker id="arw2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
